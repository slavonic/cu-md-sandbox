# Catalogue of the Ponomar Library of Liturgical Texts.
#
# Everything that is NOT in the books' own manifest.xml lives here: the English
# titles, the grouping on the front page, and the PDF scans.  A book folder that
# is not listed here is still built — it appears under "Other books" with the
# data from its manifest — so adding a book to the repository never breaks the site.
#
# ── PDF scans ────────────────────────────────────────────────────────────────
# Each [[books.X.pdf]] entry is one PDF volume, served from the site's pdf/ folder
# (see --pdf-url in build_library.py).
#
#   file          file name inside pdf/
#   offset        PDF page index = page number in the <<…>> tag + offset.
#                 Use it to skip front matter: if page 1 of the book is the 5th page
#                 of the PDF, offset = 4.  May be negative for a second volume.
#   from_chapter  (multi-volume books) first chapter, by manifest file name, whose
#                 page links go to this volume; earlier chapters use the earlier volume.
#   source        where prepare_pdf.py downloads the original scan from (DJVU or PDF).
#
# The offsets below are 0 until someone checks them against the actual scans:
# open any chapter, click a page number and see whether the scan agrees.

[site]
title_en = "Ponomar Library of Liturgical Texts"
title_ru = "Библиотека богослужебных текстов «Пономарь»"
repository = "https://github.com/slavonic/cu-md-sandbox"
report_issue = "https://github.com/slavonic/cu-md-sandbox/issues/new"
sci = "https://sci.ponomar.net/"
fonts_help = "https://sci.ponomar.net/fonts.html"

# Front-page sections, in display order.
[[categories]]
id = "scripture"
en = "Scripture"
ru = "Священное Писание"

[[categories]]
id = "hours"
en = "Psalter and Horologion"
ru = "Псалтирь и Часослов"

[[categories]]
id = "cycle"
en = "Octoechos, Triodia and Heirmologion"
ru = "Октоих, Триоди и Ирмологий"

[[categories]]
id = "menaion"
en = "Menaion"
ru = "Минеи"
compact = true          # twelve similar covers: shown as a denser shelf

[[categories]]
id = "priest"
en = "Service books of the clergy"
ru = "Служебник и Требник"

[[categories]]
id = "typikon"
en = "Typikon"
ru = "Устав"

[[categories]]
id = "ascetic"
en = "Ascetical writings"
ru = "Аскетические сочинения"

[[categories]]
id = "other"
en = "Other books"
ru = "Другие книги"

# ── Books ────────────────────────────────────────────────────────────────────
# Within a category, books appear in the order listed here.
# title_ru defaults to the manifest title; edition_ru to "publisher, year".

